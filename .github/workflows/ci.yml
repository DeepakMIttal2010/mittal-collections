name: CI

# Runs on every push/PR against main: server/ unit tests (vitest,
# self-contained via mongodb-memory-server — see
# server/tests/setup.js), client lint + production build, and the
# Playwright e2e suite against a real local MongoDB. None of the three
# jobs need repo secrets — the e2e suite's fixtures (e2e/tests/helpers.js)
# bypass the OTP/Razorpay/Cloudinary/Google/WhatsApp integrations
# entirely (writing test users directly to Mongo, placing COD-only
# orders), so JWT_SECRET/CRON_SECRET can just be throwaway CI values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run server tests
        working-directory: server
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/mittal-collections
      JWT_SECRET: e2e-ci-throwaway-secret
      CRON_SECRET: e2e-ci-throwaway-secret
      PORT: 5000
      DISABLE_AUTH_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # The mongo:7 service above starts completely empty — several e2e
      # tests assume real catalog data exists (e.g. browsing.spec.js
      # hardcodes the "bedsheets" category slug) rather than creating
      # their own fixtures for it, the same way createTestUser/
      # createTestAdmin do for accounts. Without this, every one of
      # those tests fails with "element not found" on a category/product
      # page that's actually just empty — confirmed as the root cause of
      # this job failing on every run since it was added (2026-09-01/02).
      - name: Seed test catalog data
        working-directory: server
        run: npm run seed:all

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      # Started in the background rather than via a separate step so the
      # process survives past this step — GitHub Actions keeps background
      # children alive for the rest of the job, it only reaps them at
      # job end. Logs go to a file since nothing would otherwise capture
      # a backgrounded process's output.
      - name: Start API server (background)
        working-directory: server
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:5000/api/products -o /dev/null && exit 0
            sleep 2
          done
          echo "Server did not come up in time:" && cat /tmp/server.log && exit 1

      - name: Start client dev server (background)
        working-directory: client
        run: |
          nohup npm run dev > /tmp/client.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:5173/ -o /dev/null && exit 0
            sleep 2
          done
          echo "Client did not come up in time:" && cat /tmp/client.log && exit 1

      # Both projects (desktop + mobile-375) — safe now that
      # DISABLE_AUTH_RATE_LIMIT is set above; without it, running both
      # projects back to back doubles every file's login/register
      # calls against the same server process and blows past the
      # 20-req/15min auth rate limiter (confirmed 2026-09-01: this
      # step failed with "Too many attempts" before that env var was
      # added).
      - name: Run e2e tests
        working-directory: e2e
        run: npm run test:all

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            /tmp/server.log
            /tmp/client.log
          retention-days: 7
