<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mittal Collections - Premium Home Furnishing | Bedsheets, Towels, Curtains</title>

    <!-- "Add to Home Screen" support (Android/Chrome + iOS/Safari) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mittal Collections" />

    <!-- Every page's first real content (hero image, category/product
         data) comes from these two origins, but as a client-rendered SPA
         nothing here is known until the JS bundle parses and fires its
         first fetch — without this hint, DNS/TLS setup for them only
         starts AFTER that, adding a full extra round-trip to the LCP
         critical path (flagged as "LCP request discovery" / "Network
         dependency tree" in PageSpeed Insights). Preconnecting lets the
         browser do that handshake in parallel with the JS download. -->
    <link rel="preconnect" href="https://mittal-collections-api.onrender.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Playfair Display — hero heading only (see Hero.css .hero-split-title),
         not a site-wide typeface change. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-render-blocking (preload -> swap to stylesheet on
         load): a synchronous <link rel="stylesheet"> here blocks first
         paint on this one CSS fetch even though it's only ever used for
         the hero heading. display=swap in the URL already means text
         never goes invisible while it loads, so there's no FOIT risk to
         trade away by deferring the stylesheet itself too. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
      />
    </noscript>
    <!-- No static <meta name="description"> here on purpose — every
         route sets its own via the shared <Seo> component
         (react-helmet-async). A static one here would never get
         removed by Helmet (it only manages tags it renders itself),
         leaving two duplicate description tags on every page. -->

    <!-- Google tag (gtag.js) — the dataLayer/gtag stub is set up
         immediately so early gtag() calls queue correctly, but the
         actual ~164KB script is only fetched after window "load" so
         it doesn't compete with the app's own JS for the initial
         render/interactive budget.

         Skipped entirely on /admin/* — otherwise the site owner's own
         admin-panel usage (product edits, reports, etc.) gets counted
         as real customer sessions/pageviews in GA4, polluting the
         traffic numbers this analytics is meant to measure.

         Also skipped on localhost/127.0.0.1/local network IPs — this had
         no such gate before, so every local `npm run dev` session (any
         developer's, including every automated browser check run against
         localhost while building/testing a feature) was firing real
         pageviews into the SAME production GA4 property, indistinguishable
         from genuine visitors. Confirmed live in the property: ~98% of a
         month's "sessions" were Direct-channel with ~13% engagement and
         session count ≈ user count (each "user" a single, non-returning
         hit) — the signature of repeated automated/local hits, not real
         traffic (2026-09-19). -->
    <script>
      var isLocalHost =
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.hostname.startsWith("192.168.") ||
        location.hostname.endsWith(".local");

      if (!isLocalHost && !location.pathname.startsWith("/admin")) {
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-1HP8PP1ZDM");

        window.addEventListener("load", () => {
          const script = document.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-1HP8PP1ZDM";
          document.head.appendChild(script);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
